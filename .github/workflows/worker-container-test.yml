# Prueba el binario vía node spawn (igual que worker.js) dentro del contenedor,
# con y sin límites. Reporta como comentario del commit.
name: worker-container-test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-container-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: pip install openpyxl
      - name: Generar xlsx de prueba
        run: |
          mkdir -p /tmp/t
          python3 - <<'EOF'
          import openpyxl
          inv = [['Guía WR','Consignatario','Tracking','Tipo Empaque','Peso Kg','Estado Entrega'],
                 ['WR-001','','','','',''],['WR-002','','','','',''],['WR-999',' intacto','X','CAJA',1,'PENDIENTE']]
          ent = [['WR','Tracking','Cliente','Tipo Paquete','Peso','Estado','Modificado'],
                 ['WR-001','000123','JUAN PEREZ','CAJA',2.5,'ENTREGADO','2026-09-20'],
                 ['WR-002','TRK-002','MARIA LOPEZ','SOBRE',0.5,'ENTREGADO','2026-09-21']]
          env = [['WR','Tracking','Cliente','Tipo Paquete','Peso','Estado','Modificado'],
                 ['WR-003','TRK-003','CARLOS RUIZ','SACA',5,'ENVIADO','2026-09-22']]
          for name, rows in [('inv.xlsx',inv),('ent.xlsx',ent),('env.xlsx',env)]:
              wb = openpyxl.Workbook(); ws = wb.active
              for r in rows: ws.append(r)
              wb.save(f'/tmp/t/{name}')
          print('archivos OK')
          EOF
      - name: Script node-spawn
        run: |
          cat > /tmp/spawn-test.js <<'EOF'
          const { spawn } = require('node:child_process');
          const tag = process.argv[2] || 'T';
          const out = `/t/out-${tag}.xlsx`, csv = `/t/un-${tag}.csv`;
          const c = spawn('/app/processor/AmexInventoryProcessor',
            ['/t/inv.xlsx', '/t/ent.xlsx', '/t/env.xlsx', '/t/env.xlsx', out, csv],
            { stdio: ['ignore', 'pipe', 'pipe'] });
          let o = '', e = '';
          c.stdout.on('data', (d) => { o += d; });
          c.stderr.on('data', (d) => { e += d; });
          c.on('error', (er) => { console.log(`[${tag}] SPAWN-ERROR ${er.message}`); process.exit(3); });
          c.on('close', (code, sig) => {
            console.log(`[${tag}] CLOSE code=${code} sig=${sig}`);
            console.log(`[${tag}] STDOUT: ${o.slice(-400) || '(vacío)'}`);
            console.log(`[${tag}] STDERR: ${e.slice(-1200) || '(vacío)'}`);
          });
          EOF
          echo 'script OK'
      - name: Test 3 node-spawn sin límites
        run: |
          echo '--- TEST3 node-spawn sin límites ---' > /tmp/diag.log
          docker run --rm -v /tmp/t:/t -v /tmp/spawn-test.js:/s.js \
            --entrypoint node ghcr.io/martinmaldonado5/amex-inventory-worker:latest \
            /s.js T3 >> /tmp/diag.log 2>&1 || echo "docker exit=$?" >> /tmp/diag.log
          ls -la /tmp/t/ >> /tmp/diag.log 2>&1
      - name: Test 4 node-spawn con límites Render Free
        run: |
          echo '--- TEST4 node-spawn 512m 0.5cpu ---' >> /tmp/diag.log
          docker run --rm -v /tmp/t:/t -v /tmp/spawn-test.js:/s.js \
            --memory=512m --cpus=0.5 \
            --entrypoint node ghcr.io/martinmaldonado5/amex-inventory-worker:latest \
            /s.js T4 >> /tmp/diag.log 2>&1 || echo "docker exit=$?" >> /tmp/diag.log
          ls -la /tmp/t/ >> /tmp/diag.log 2>&1
      - name: Publicar diagnóstico como comentario del commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diag = fs.readFileSync('/tmp/diag.log', 'utf8').slice(-6000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'DIAG-SPAWN-TEST (autogenerado):\n```\n' + diag + '\n```',
            });
