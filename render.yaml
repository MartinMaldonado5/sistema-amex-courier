# Worker de Inventario AMEX (Render) — servicio image-backed.
# La imagen se precompila en GitHub Actions (.github/workflows/worker-docker-build.yml)
# y se publica en GHCR, porque el plan Free de Render no compila el Dockerfile .NET.
# Los secretos (sync: false) se completan en el Dashboard, nunca aquí.
# Servicio actual: amex-inventory-worker-img (https://amex-inventory-worker-img.onrender.com)
services:
  - type: web
    name: amex-inventory-worker-img
    runtime: image
    image:
      url: ghcr.io/martinmaldonado5/amex-inventory-worker:latest
    plan: free
    region: oregon
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: SUPABASE_URL
        value: https://tliubfyepimzlimxrquz.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: amex-courier-cloud
      - key: CLOUDFLARE_R2_ROOT_FOLDER
        value: FOLDER AMEX
      - key: POLL_INTERVAL_MS
        value: '5000'
